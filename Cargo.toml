[package]
name = "forager_exec"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/wezel-build/forager_exec"
publish = false
license = "Apache-2.0"

[[bin]]
name = "forager-exec"
path = "src/main.rs"

[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1"
forager_sdk = { git = "https://github.com/wezel-build/wezel" }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
wezel_types = { git = "https://github.com/wezel-build/wezel" }

[profile.dist]
inherits = "release"
lto = "thin"
